<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active S2 Shows</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .show-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .show-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
            margin-bottom: 15px;
        }
        .show-title {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .show-info {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .info-label {
            font-weight: bold;
            color: #666;
        }
        .info-value {
            color: #333;
        }
        .status-active {
            color: #27ae60;
            font-weight: bold;
        }
        .error { 
            color: red;
            padding: 10px;
            background-color: #ffe6e6;
            border-radius: 4px;
        }
        .task-list {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .details-section {
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .detail-label {
            font-weight: bold;
            color: #666;
            padding-right: 10px;
        }
        .detail-value {
            color: #333;
            word-break: break-word;
        }
        .json-view {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 12px;
        }
        .toggle-details {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .stage-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        .stage-Active { background-color: #27ae60; color: white; }
        .stage-Completed { background-color: #2980b9; color: white; }
        .stage-OnHold { background-color: #f39c12; color: white; }
        .stage-Cancelled { background-color: #c0392b; color: white; }
        .show-count {
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #666;
        }
        .show-filters {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Active S2 Shows</h1>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="show-count">
        Total Active Shows: {{ shows|length }}
    </div>

    <div class="show-grid">
        {% for show in shows %}
        <div class="show-card">
            <div class="show-info">
                <span class="info-label">Show Name:</span>
                <span class="info-value">{{ show.show_name }}</span>
                
                <span class="info-label">ID:</span>
                <span class="info-value">{{ show.id }}</span>
                
                <span class="info-label">Status:</span>
                <span class="info-value">{{ show.status }}</span>
            </div>
            <button onclick="window.location.href='/show/{{ show.id }}/tasks'" class="view-tasks">
                View Tasks
            </button>
        </div>
        {% else %}
        <p>No active shows found.</p>
        {% endfor %}
    </div>

    <!-- Remove unused elements -->
    <div id="task-container" class="task-list hidden">
        <h2>Tasks</h2>
        <div id="task-list"></div>
    </div>
</body>
</html>
